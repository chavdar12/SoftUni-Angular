@if (user.currentUser(); as currentUser) {
  <div class="profile">
    <img src="profile.png" alt="default user" />
    <h3>User Info:</h3>
    <div class="flex">
      <p>Username:</p>
      <p>{{ currentUser.username }}</p>
    </div>
    <div class="flex">
      <p>Email:</p>
      <p>{{ currentUser.email }}</p>
    </div>
    <div class="flex">
      <p>Phone:</p>
      <p>{{ currentUser.tel || '-' }}</p>
    </div>
    <!-- Editing is implemented in the Forms workshop (Part 3). -->
    <button class="edit-button" disabled>Edit</button>
  </div>
}
