<form
  class="register"
  (submit)="
    register($event, username.value, email.value, tel.value, password.value, rePassword.value)
  "
>
  <fieldset>
    <h2>Registration Form</h2>

    <p class="field field-icon">
      <label for="username"
        ><span><i class="fas fa-user"></i></span
      ></label>
      <input #username type="text" name="username" id="username" placeholder="Johny" />
    </p>

    <p class="field field-icon">
      <label for="email"
        ><span><i class="fas fa-envelope"></i></span
      ></label>
      <input #email type="email" name="email" id="email" placeholder="john.doe@gmail.com" />
    </p>

    <p class="field field-icon">
      <label for="tel"
        ><span><i class="fas fa-phone"></i></span
      ></label>
      <select name="select-tel" id="select-tel" class="tel">
        <option value="00359">+359</option>
      </select>
      <input #tel type="text" name="tel" id="tel" placeholder="885 888 888" />
    </p>

    <p class="field field-icon">
      <label for="password"
        ><span><i class="fas fa-lock"></i></span
      ></label>
      <input #password type="password" name="password" id="password" placeholder="******" />
    </p>

    <p class="field field-icon">
      <label for="rePassword"
        ><span><i class="fas fa-lock"></i></span
      ></label>
      <input #rePassword type="password" name="rePassword" id="rePassword" placeholder="******" />
    </p>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button>Create Account</button>

    <p class="text-center">
      Have an account?
      <a routerLink="/login">Log In</a>
    </p>
  </fieldset>
</form>
