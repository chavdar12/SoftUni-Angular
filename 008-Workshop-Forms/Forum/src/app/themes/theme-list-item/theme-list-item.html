<div class="theme-container">
  <div class="theme-name-wrapper">
    <div class="theme-name">
      <a class="normal" [routerLink]="['/themes', theme()._id]">
        <h2>{{ theme().themeName }}</h2>
      </a>
      <div class="columns">
        <div>
          <p>
            Date: <time>{{ theme().created_at | date: 'yyyy-MM-dd HH:mm' }}</time>
          </p>
          <div class="nick-name">
            <p>
              Username: <span>{{ theme().userId.username }}</span>
            </p>
          </div>
        </div>
        <div class="subscribers">
          @if (user.isLoggedIn()) {
            @if (isSubscribed()) {
              <button class="unsubscribe">Unsubscribe</button>
            } @else {
              <button class="subscribe">Subscribe</button>
            }
          }
          <p>
            Subscribers: <span>{{ theme().subscribers.length }}</span>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
